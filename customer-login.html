<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WhopperCRM | Customer Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f7ff 0%, #e0eaff 100%); color: #0a2b3e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    :root {
      --primary-deep: #283593;
      --primary-bright: #3f51b5;
      --primary-light: #e8eaf6;
      --za-green: #007a4d;
      --pure-white: #ffffff;
      --soft-white: #fefefe;
      --gray-light: #f5f5f5;
      --text-dark: #1a237e;
      --text-muted: #5c6bc0;
      --border-light: #c5cae9;
      --shadow-md: 0 12px 28px rgba(26, 35, 126, 0.12);
    }

    .login-card { background: var(--pure-white); padding: 3rem; border-radius: 32px; box-shadow: var(--shadow-md); width: 100%; max-width: 440px; text-align: center; border: 1px solid var(--border-light); }
    .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2rem; }
    .logo i { font-size: 2.5rem; color: var(--za-green); background: #e8f5e9; padding: 12px; border-radius: 20px; }
    .logo h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary-deep), var(--za-green)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    
    .login-header h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-dark); }
    .login-header p { color: var(--text-muted); margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-dark); }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .form-group input { width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; border-radius: 12px; border: 1px solid var(--border-light); outline: none; transition: 0.2s; font-family: inherit; background: var(--soft-white); }
    .form-group input:focus { border-color: var(--za-green); box-shadow: 0 0 0 4px rgba(0, 122, 77, 0.1); }

    .btn-login { background: var(--za-green); color: white; border: none; padding: 1rem; width: 100%; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-bottom: 1.5rem; }
    .btn-login:hover { background: #005a39; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(63, 81, 181, 0.3); }

    .demo-info { background: #e8eaf6; border: 1px dashed #3f51b5; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: left; }
    .demo-info p { font-size: 0.8rem; color: #1a237e; margin-bottom: 4px; font-weight: 600; }
    .demo-info code { background: rgba(255,255,255,0.5); padding: 2px 6px; border-radius: 4px; color: #000; font-family: monospace; font-size: 0.85rem; }

    .footer-links { margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted); }
    .footer-links a { color: var(--za-green); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <i class="fas fa-shopping-cart"></i>
    <h1>WhopperCRM</h1>
  </div>
  
  <div class="login-header">
    <h2>Client Portal</h2>
    <p>Sign in to track your orders across Mzansi</p>
  </div>

  <form action="customer-portal.html">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope"></i>
        <input type="email" placeholder="you@example.co.za" required>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn-login">Sign In (Heita!)</button>
  </form>

  <div class="demo-info">
    <p><i class="fas fa-info-circle"></i> <strong>Customer Demo Login:</strong></p>
    <p>Email: <code>thabo@jozihub.co.za</code></p>
    <p>Password: <code>password123</code></p>
  </div>

  <div class="footer-links">
    New client? <a href="#">Create an account</a><br>
    <a href="login.html" style="font-size: 0.8rem; margin-top: 1rem; display: inline-block;">Admin Login</a>
  </div>
</div>

</body>
</html>
